<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>João Barbosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1E4D3A; --green-2:#2B6650; --paper:#E9F0EA; --sheet:#F6F9F6;
  --ink:#15231C; --muted:#56695E; --gold:#C49A3A; --gold-ink:#7A5A14;
  --line:#C9D6CD; --err:#9B2C2C;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Literata",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--ui);-webkit-tap-highlight-color:transparent}
a{color:var(--green)}
img{max-width:100%;display:block}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--green);color:var(--paper);
  display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
header .brand{font-family:var(--display);font-size:20px;letter-spacing:.2px}
.lang{display:flex;border:1px solid rgba(233,240,234,.4);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--paper);padding:4px 12px;font-size:14px}
.lang button[aria-pressed=true]{background:var(--paper);color:var(--green);font-weight:600}
.lang select{background:var(--green);color:var(--paper);border:0;padding:4px 10px;font-size:14px}
.notice{background:#F3E6C4;color:var(--gold-ink);border-radius:4px;padding:10px 12px;font:14px/1.4 var(--ui);margin:0 0 16px}

main{padding:0 0 96px}
.view{display:none}
.view.on{display:block}
.wrap{padding:24px 20px;max-width:640px;margin:0 auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 11px;
  text-decoration:none;color:var(--muted);font-size:12px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current=page]{color:var(--green);font-weight:600}

/* Início */
.hero{background:var(--green);color:var(--paper);padding:28px 20px 36px;overflow:hidden}
.hero-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 132px;gap:18px;align-items:end}
.hero h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;margin:6px 0 14px}
.hero p{margin:0 0 18px;color:#CFE0D5;max-width:34ch}
.hero .status{font-size:14px;color:var(--gold)}
.cover{aspect-ratio:2/3;border-radius:3px;background:#2B6650 center/cover;box-shadow:0 14px 30px rgba(0,0,0,.35);transform:rotate(3deg)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);color:#1C1406}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.green{background:var(--green);color:var(--paper)}
.btn:disabled{opacity:.5}

h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:0 0 12px}
h3{font-size:17px;margin:20px 0 4px}
.lead{font-size:18px}
.muted{color:var(--muted)}
.block{padding:22px 0;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.facets{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:10px}
.facets h3{margin:0 0 2px;font-size:15px}
.facets p{margin:0;font-size:14px;color:var(--muted)}
.next{background:var(--ink);color:var(--paper);border-radius:4px;padding:22px}
.next .z{font-family:var(--display);font-size:56px;line-height:1;color:var(--gold)}
.next p{color:#B9C8BE;margin:10px 0 0}
.portrait{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--line)}
video{width:100%;border-radius:4px;background:#000;margin-top:12px}

/* Selo (porta de entrada da leitura) */
.seal-stage{text-align:center;padding:36px 20px 8px}
.seal{width:168px;height:168px;margin:0 auto 22px;position:relative}
.seal svg{width:100%;height:100%}
.seal.broken .half-l{transform:translate(-14px,6px) rotate(-14deg);opacity:0}
.seal.broken .half-r{transform:translate(14px,6px) rotate(14deg);opacity:0}
.seal .half-l,.seal .half-r{transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .7s .2s;transform-origin:center}
@media (prefers-reduced-motion:reduce){.seal .half-l,.seal .half-r{transition:none}}
.seal-stage p{max-width:32ch;margin:0 auto 22px}

/* Kit */
.kit{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px}
.kit .price{font-family:var(--display);font-size:34px}
.kit ul{padding-left:20px;margin:10px 0}
.test-flag{display:inline-block;background:#F3E6C4;color:var(--gold-ink);border-radius:3px;padding:2px 8px;font-size:13px;font-weight:600}
.charity{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:16px 0 0;font-size:15px}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 4px}
input[type=text],input[type=email]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input.code{text-transform:uppercase;letter-spacing:2px;font-weight:600}
.msg{margin:12px 0 0;font-size:15px}
.msg.err{color:var(--err)}
.receipt{background:#fff;border:1px dashed var(--green);border-radius:6px;padding:16px;margin-top:16px}
.receipt .c{font:600 22px/1.2 var(--ui);letter-spacing:2px;color:var(--green)}

/* Leitor */
.chapters{list-style:none;padding:0;margin:8px 0 0}
.chapters li a{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.chapters .done{color:var(--muted);font-size:14px}
.reader{background:var(--sheet);min-height:100vh}
.reader.dark{background:#17201B;color:#D9E3DC}
.reader-bar{position:sticky;top:52px;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 16px;background:inherit;border-bottom:1px solid var(--line)}
.reader.dark .reader-bar{border-color:#2D3A33}
.reader-bar button{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:inherit}
.reader article{font-family:var(--read);font-size:var(--fs,19px);line-height:1.7;max-width:36em;margin:0 auto;padding:24px 22px 40px}
.reader article h2{font-family:var(--display)}
.reader .pager{display:flex;justify-content:space-between;max-width:36em;margin:0 auto;padding:0 22px 40px}
.placeholder{border:1px dashed var(--muted);padding:12px;font-family:var(--ui);font-size:14px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);padding-top:18px}
</style>
</head>
<body>
<header>
  <span class="brand">João Barbosa</span>
  <div class="lang" role="group" aria-label="Idioma / Language" id="langSwitch"></div>
</header>

<main>
  <!-- INÍCIO -->
  <section class="view" id="v-home">
    <div class="hero">
      <div class="hero-in">
        <div>
          <span class="status" data-t="preorder"></span>
          <h1 data-t="bookTitle"></h1>
          <p data-t="heroText"></p>
          <div class="btns">
            <a class="btn gold" href="#ler" data-t="startReading"></a>
            <a class="btn ghost" href="#kit" data-t="seeKit"></a>
          </div>
        </div>
        <div class="cover" style="background-image:url('https://joaobarbosa.pt/wp-content/uploads/2025/02/livro-familias-poder.jpg')" role="img" aria-label="Capa"></div>
      </div>
    </div>
    <div class="wrap">
      <div class="block">
        <h2 data-t="aboutBookH"></h2>
        <p class="lead" data-t="aboutBook1"></p>
        <p data-t="aboutBook2"></p>
      </div>
      <div class="block">
        <div class="next">
          <span class="muted" data-t="nextBook"></span>
          <div class="z">Z13É</div>
          <p data-t="z13"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- LER (bloqueado / desbloqueado) -->
  <section class="view" id="v-ler">
    <div id="gate">
      <div class="seal-stage">
        <div class="seal" id="seal" aria-hidden="true">
          <svg viewBox="0 0 168 168">
            <g class="half-l"><path d="M84 6 C40 6 6 40 6 84 s34 78 78 78 L78 120 90 96 76 70 88 44Z" fill="#C49A3A"/></g>
            <g class="half-r"><path d="M84 6 C128 6 162 40 162 84 s-34 78 -78 78 L78 120 90 96 76 70 88 44Z" fill="#B88C2E"/></g>
            <circle cx="84" cy="84" r="50" fill="none" stroke="#7A5A14" stroke-width="2" opacity=".55"/>
            <text x="84" y="98" text-anchor="middle" font-family="Young Serif, Georgia, serif" font-size="44" fill="#4E3A0C">JB</text>
          </svg>
        </div>
        <h2 data-t="sealedH"></h2>
        <p class="muted" data-t="sealedP"></p>
        <div class="btns" style="justify-content:center">
          <a class="btn green" href="#kit" data-t="getKit"></a>
          <a class="btn ghost" href="#kit/codigo" data-t="haveCode"></a>
        </div>
      </div>
    </div>
    <div id="toc" class="wrap" hidden>
      <h2 data-t="bookTitle"></h2>
      <p class="muted" data-t="tocP"></p>

      <ul class="chapters" id="chapterList"></ul>
    </div>

  <section class="view reader" id="v-cap">

          <p class="msg" id="buyMsg" role="status"></p>
          <div class="receipt" id="receipt" hidden>
            <div data-t="orderOk"></div>
            <div class="muted" id="orderId"></div>
            <p style="margin:10px 0 4px" data-t="yourCode"></p>
            <div class="c" id="orderCode"></div>

      </div>

        <h2 data-t="contactH"></h2>
        <p>Travessa do Ribeiro Nº 14, Ribeiro Merufe<br>4950-327 Monção, Portugal</p>

        </div>
        <p class="foot">
          <a href="https://joaobarbosa.pt">joaobarbosa.pt</a> &nbsp; <a href="https://joaobarbosa.es">joaobarbosa.es</a><br>
          <a href="https://joaobarbosa.pt/termos-condicoes/" data-t="terms"></a> &nbsp;
          <a href="https://joaobarbosa.pt/politica-privacidade/" data-t="privacy"></a> &nbsp;
          <a href="https://joaobarbosa.pt/livro-reclamacoes/" data-t="complaints"></a>
        </p>
      </div>
    </div>

</main>

<nav class="tabs" aria-label="Navegação">
  <a href="#inicio" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="tHome"></span></a>
  <a href="#ler" data-tab="ler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg><span data-t="tRead"></span></a>
  <a href="#kit" data-tab="kit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h18v12H3z"/><path d="M3 8l2-4h14l2 4M12 8v12"/></svg><span>Kit</span></a>
  <a href="#autor" data-tab="autor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span data-t="tAuthor"></span></a>
  <a href="https://joaobarbosa.pt/loja/" data-tab="loja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14l-1 13H6z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span data-t="tShop"></span></a>
</nav>

<script>
/* ---------- Línguas ----------
   Acrescentar uma língua:
     1. copiar i18n/pt.json para i18n/<código>.json e traduzir os valores
     2. juntar { code, name } a LANGS
     3. (opcional) criar book/<código>.json e juntar o código a BOOK_LANGS
   Chaves em falta caem automaticamente para PT. */
const LANGS = [
  { code:"pt", name:"Português" },
  { code:"fr", name:"Français" },
  { code:"es", name:"Español" }
];
const BOOK_LANGS = ["pt","es"];
const DEFAULT = "pt";

let BASE={}, T={}, BOOK={chapters:[]}, bookLang=DEFAULT;
const cache={};
function getJSON(path){
  if(!cache[path]) cache[path]=fetch(path).then(r=>{ if(!r.ok) throw new Error(path); return r.json(); });
  return cache[path];
}
async function loadLang(code){
  BASE = await getJSON(`i18n/${DEFAULT}.json`);
  try { T = code===DEFAULT ? BASE : await getJSON(`i18n/${code}.json`); } catch(e){ T = BASE; }
  bookLang = BOOK_LANGS.includes(code) ? code : DEFAULT;
  BOOK = await getJSON(`book/${bookLang}.json`);
}

/* ---------- Ponte nativa (com fallback para testar no browser) ---------- */
const AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const chk=b=>{let n=0;[...b].forEach((c,i)=>{n=(n*31+(AL.indexOf(c)+1)*(i+7))%1024});return AL[n>>5]+AL[n%32]};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const Kit = window.KitNative || {
  isTestMode:()=>true,
  isUnlocked:()=>!!store.get("kit.code"),
  redeem(c){const s=c.toUpperCase().replace(/[^A-Z0-9]/g,"");const ok=s==="TESTE2026"||(s.length===10&&s.startsWith("JB")&&chk(s.slice(2,8))===s.slice(8));if(ok)store.set("kit.code",s);return ok},
  testPurchase(){let b="";for(let i=0;i<6;i++)b+=AL[Math.floor(Math.random()*32)];const c=b+chk(b);store.set("kit.code","JB"+c);return JSON.stringify({ok:true,order:"TESTE-"+String(Date.now()).slice(-6),code:"JB-"+c.slice(0,4)+"-"+c.slice(4)})},
  reset(){store.del("kit.code")}
};

/* ---------- Estado e i18n ---------- */
const codes=LANGS.map(l=>l.code), pref=(navigator.language||DEFAULT).slice(0,2).toLowerCase();
let lang = codes.includes(store.get("lang")) ? store.get("lang") : (codes.includes(pref) ? pref : DEFAULT);
let fs = +(store.get("reader.fs")||19), dark = store.get("reader.dark")==="1";
const $=s=>document.querySelector(s);
const t=k=>T[k] ?? BASE[k] ?? k;

function renderLangSwitch(){
  const box=$("#langSwitch"); box.innerHTML="";
  if(LANGS.length>4){
    const sel=document.createElement("select"); sel.setAttribute("aria-label","Idioma / Language");
    LANGS.forEach(l=>sel.add(new Option(l.name,l.code,false,l.code===lang)));
    sel.onchange=()=>setLang(sel.value); box.appendChild(sel);
  } else {
    LANGS.forEach(l=>{
      const b=document.createElement("button");
      b.textContent=l.code.toUpperCase(); b.dataset.lang=l.code; b.lang=l.code;
      b.setAttribute("aria-label",l.name); b.onclick=()=>setLang(l.code); box.appendChild(b);
    });
  }
}
async function setLang(code){
  lang=code; store.set("lang",lang);
  await loadLang(lang); applyLang();
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("#langSwitch button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const sel=$("#langSwitch select"); if(sel) sel.value=lang;
  document.querySelectorAll("[data-book-notice]").forEach(n=>n.hidden=bookLang===lang);
  $("#themeBtn").textContent=t(dark?"day":"night");
  renderToc(); if(location.hash.startsWith("#cap/")) route();
}

/* ---------- Router ---------- */
function show(id,tab){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id));
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  window.scrollTo(0,0);
}
function route(){
  const h=location.hash.slice(1)||"inicio";
  const unlocked=Kit.isUnlocked();
  if(h==="ler"){ $("#gate").hidden=unlocked; $("#toc").hidden=!unlocked; if(unlocked)renderToc(); show("v-ler","ler"); }
  else if(h.startsWith("cap/")){ if(!unlocked){location.replace("#ler");return} openChapter(+h.split("/")[1]); show("v-cap","ler"); }
  else if(h.startsWith("kit")){ renderKit(); show("v-kit","kit"); if(h==="kit/codigo")setTimeout(()=>$("#codigo").scrollIntoView(),0); }
  else if(h==="autor") show("v-autor","autor");
  else show("v-home","home");
}
window.addEventListener("hashchange",route);
window.appBack=()=>{ if(location.hash&&location.hash!=="#inicio"){history.back();return true} return false; };

/* ---------- Kit ---------- */
function renderKit(){
  const u=Kit.isUnlocked(), test=Kit.isTestMode();
  $("#kitOwned").hidden=!u; $("#kitBuy").hidden=u;
  $("#testFlag").hidden=!test; $("#buyBtn").disabled=!test;
  $("#resetWrap").hidden=!(test&&u);
}
$("#buyBtn").onclick=()=>{
  const n=$("#bName").value.trim(), e=$("#bEmail").value.trim(), m=$("#buyMsg");
  if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){m.className="msg err";m.textContent=t("errName");return}
  const r=JSON.parse(Kit.testPurchase(n,e));
  if(!r.ok)return;
  m.textContent=""; $("#orderId").textContent=r.order; $("#orderCode").textContent=r.code; $("#receipt").hidden=false;
  $("#buyBtn").disabled=true;
};
$("#redeemBtn").onclick=()=>{
  const m=$("#codeMsg");
  if(Kit.redeem($("#codeIn").value)){ m.className="msg"; m.textContent=t("okCode"); breakSealThen("#ler"); }
  else { m.className="msg err"; m.textContent=t("errCode"); }
};
$("#resetBtn").onclick=e=>{e.preventDefault();Kit.reset();store.del("reader.done");store.del("reader.last");$("#receipt").hidden=true;$("#seal").classList.remove("broken");renderKit()};
function breakSealThen(hash){
  location.hash=hash;
  requestAnimationFrame(()=>{ $("#gate").hidden=false; $("#toc").hidden=true; $("#seal").classList.add("broken");
    setTimeout(()=>{$("#gate").hidden=true;$("#toc").hidden=false;renderToc()}, matchMedia("(prefers-reduced-motion: reduce)").matches?0:1100); });
}

/* ---------- Leitor ---------- */
const done=()=>JSON.parse(store.get("reader.done")||"{}");
function renderToc(){
  const d=done(), ul=$("#chapterList"); ul.innerHTML="";
  BOOK.chapters.forEach((c,i)=>{const li=document.createElement("li");li.innerHTML=`<a href="#cap/${i}"><span>${c.title}</span><span class="done">${d[i]?t("read"):""}</span></a>`;ul.appendChild(li)});
}
function openChapter(i){
  const ch=BOOK.chapters; i=Math.max(0,Math.min(ch.length-1,i||0));
  const note = bookLang!==lang ? `<p class="notice">${t("bookNotice")}</p>` : "";
  $("#chapter").innerHTML=note+`<h2>${ch[i].title}</h2>`+ch[i].html;
  $("#chapter").lang=bookLang;
  const d=done(); d[i]=1; store.set("reader.done",JSON.stringify(d)); store.set("reader.last",i);
  $("#prevCh").style.visibility=i>0?"visible":"hidden"; $("#prevCh").href="#cap/"+(i-1);
  $("#nextCh").style.visibility=i<ch.length-1?"visible":"hidden"; $("#nextCh").href="#cap/"+(i+1);
}
function applyReader(){ $("#v-cap").style.setProperty("--fs",fs+"px"); $("#v-cap").classList.toggle("dark",dark); $("#themeBtn").textContent=t(dark?"day":"night"); }
$("#fsUp").onclick=()=>{fs=Math.min(28,fs+1);store.set("reader.fs",fs);applyReader()};
$("#fsDown").onclick=()=>{fs=Math.max(15,fs-1);store.set("reader.fs",fs);applyReader()};
$("#themeBtn").onclick=()=>{dark=!dark;store.set("reader.dark",dark?"1":"0");applyReader()};

(async()=>{ await loadLang(lang); renderLangSwitch(); applyLang(); applyReader(); route(); })();
</script>
</body>
</html>
